name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:smoke

  mac-arm64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:smoke
      - run: pnpm dist:mac:arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create checksum and dependency license inventory
        run: |
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt)
          pnpm --silent licenses:inventory > dist/dependency-licenses.json
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-mac-arm64
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
            dist/dependency-licenses.json
          if-no-files-found: error

  mac-x64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:smoke
      - run: pnpm dist:mac:x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create checksum and dependency license inventory
        run: |
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt)
          pnpm --silent licenses:inventory > dist/dependency-licenses.json
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-mac-x64
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
            dist/dependency-licenses.json
          if-no-files-found: error

  windows-x64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:smoke
      - run: pnpm dist:win:x64
      - name: Create checksum and dependency license inventory
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe |
            Sort-Object Name |
            ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)" } |
            Set-Content -Encoding utf8 dist/SHA256SUMS.txt
          pnpm --silent licenses:inventory | Out-File -Encoding utf8 dist/dependency-licenses.json
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/dependency-licenses.json
          if-no-files-found: error
