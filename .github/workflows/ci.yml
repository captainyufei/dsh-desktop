name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check committed whitespace
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$EVENT_BASE_SHA" ] && git cat-file -e "${EVENT_BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$EVENT_BASE_SHA" "$GITHUB_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:smoke

  mac-arm64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:smoke
      - run: pnpm dist:mac:arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create checksum
        run: |
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-mac-arm64
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
            build/generated/legal/LICENSE
            build/generated/legal/THIRD_PARTY_NOTICES.md
            build/generated/legal/dependency-licenses.json
          if-no-files-found: error

  mac-x64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:smoke
      - run: pnpm dist:mac:x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create checksum
        run: |
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-mac-x64
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
            build/generated/legal/LICENSE
            build/generated/legal/THIRD_PARTY_NOTICES.md
            build/generated/legal/dependency-licenses.json
          if-no-files-found: error

  windows-x64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:smoke
      - run: pnpm dist:win:x64
      - name: Create checksum
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe |
            Sort-Object Name |
            ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)" } |
            Set-Content -Encoding utf8 dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            build/generated/legal/LICENSE
            build/generated/legal/THIRD_PARTY_NOTICES.md
            build/generated/legal/dependency-licenses.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - quality
      - mac-arm64
      - mac-x64
      - windows-x64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-*
          path: release-artifacts
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-upload
          while IFS= read -r -d '' asset; do
            cp "$asset" "release-upload/$(basename "$asset")"
          done < <(find release-artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -print0)
          test "$(find release-upload -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          (cd release-upload && sha256sum *.dmg *.exe > SHA256SUMS.txt)
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            DSH Desktop v0.1.0 community release.

            Downloads:
            - macOS Apple Silicon (ARM64)
            - macOS Intel (x64)
            - Windows x64

            This release fixes Windows folder selection and UNC paths, prevents installer hangs, keeps both sidebars usable, and unifies the application icon with the landing page.

            These community builds are not code-signed or notarized. Windows SmartScreen or macOS Gatekeeper may require confirming the first launch.
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-upload -maxdepth 1 -type f -print0)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DSH Desktop v0.1.0" \
            --notes "$RELEASE_NOTES"
